services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: lending
      POSTGRES_DB: lending
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending -d lending"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://lending:lending@postgres:5432/lending?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me
      HTTP_ADDR: :8080
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TARGET: worker
    environment:
      DATABASE_URL: postgres://lending:lending@postgres:5432/lending?sslmode=disable
      LOG_LEVEL: info
      WORKER_POLL_INTERVAL: 2s
      WORKER_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
